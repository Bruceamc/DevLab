<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document 1</title>
    <style>
        /* Comentário em CSS */
        body{
            background-color: rgb(14, 102, 112);
            color: white;
            font: normal 20pt arial;
        }
    </style>
</head>
<body>
    <!-- Comentário em HTML -->
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição.</p>

    <script>
        var n1 = Number.parseInt(window.prompt("Digite um número inteiro."))
        //Number.parseInt() trata número inteiros.

        var n2 = Number.parseFloat(window.prompt("Digite um número real."))
        //Number.parsefloat trata números reais.

        var n3 = number(window.prompt("Digite qualquer outro número."))
        //number() 

        var soma = n1 + n2 +n3
        window.alert("A soma dos valores é " + soma)
        // number + number = adição.
        // string + string = concartenação.

    </script>
</body>
</html>
